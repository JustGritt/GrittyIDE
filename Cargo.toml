[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/JustGritt/GrittyIDE"
publish = false

# Shared, pinned dependency versions. Add a crate here only when a workspace
# member actually uses it, with a one-line justification in the task report.
[workspace.dependencies]
gritty-core = { path = "crates/gritty-core" }
gritty-workspace = { path = "crates/workspace" }
gritty-persistence = { path = "crates/persistence" }
gritty-terminal = { path = "crates/terminal" }
gritty-agents = { path = "crates/agents" }
gritty-agent-hook = { path = "crates/agent-hook" }
# T300-FAKE: the deterministic fake agent (Gate D). A path dependency, no new
# third-party crate, and deliberately the only direction that works —
# `gritty-core` depends on this so its run manager can drive it, exactly as it
# depends on `gritty-agents` and `gritty-terminal`.
gritty-agent-fake = { path = "crates/agent-fake" }
# T310-A: the Claude Code adapter, built the same way and for the same reason —
# `gritty-core` will depend on this so `agent_run/claude_driver.rs` can drive a
# real child, and the reverse edge would be the same Cargo cycle.
gritty-agent-claude = { path = "crates/agent-claude" }
gritty-git = { path = "crates/git" }
# T102-R: the git *write* adapter (ADR-029 decision 2). A separate crate from
# `gritty-git` on purpose: that one promises "nothing writes" and "no external
# program runs" and has a test enforcing it, so the two never depend on each
# other in anything that ships and `gritty-core::git` composes both. A path
# dependency; it adds no new third-party crate.
gritty-git-write = { path = "crates/git-write" }
gritty-search = { path = "crates/search" }
tauri = { version = "2.11.5", features = [] }
tauri-build = { version = "2.6.3", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# T010 core protocol: async primitives on Tauri's tokio runtime, cooperative
# cancellation, ids, error derive and Rust -> TypeScript type export.
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7.19"
uuid = { version = "1.26.0", features = ["v7"] }
thiserror = "2.0.20"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
# T020 workspace: native directory picker, invoked from the Rust side only.
tauri-plugin-dialog = "2.7.3"
# T030 documents: content hashing for dirty/external-change detection. Already in
# the tree through tauri-codegen, so this adds no new crate.
sha2 = "0.10.9"
# T050 shell: URL parsing for the `shell.openExternal` allowlist. Already in the
# tree through tauri, so this adds no new crate.
url = "2.5.8"
# T050 shell: open http(s) URLs with the system's default handler, Rust side only
# (the WebView never gets a shell or opener API).
open = "5.4.3"
# T060 persistence: SQLite for session state and dirty-buffer snapshots (ADR-004,
# ADR-014). `bundled` compiles SQLite from source so every platform runs the same
# library version; no system SQLite is consulted.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# T090 terminal: cross-platform PTY (openpty/forkpty behind one interface). The
# only crate in the tree that opens a pseudo-terminal; kept behind the
# `gritty-terminal` adapter so the rest of the core never sees it.
portable-pty = "0.9.0"
# T223 attention: raise a system notification when an observed agent session
# stops and needs the user. Nothing in the tree can do this, and hand-rolling
# `UNUserNotificationCenter` would need an `unsafe_code` allow against a
# workspace-wide deny. Rust side only; the WebView is granted none of its
# commands.
tauri-plugin-notification = "2.4.0"
# T090 terminal: safe wrappers for the POSIX signal calls that terminate a
# whole process group (`killpg`). Avoids an `unsafe_code` allow for two calls;
# unix-only, not compiled on Windows.
nix = { version = "0.31.3", features = ["signal", "process", "user"] }
# T100 git: read a repository in-process (ADR-023). Pure Rust end to end, so
# the one subsystem whose inputs are an attacker's file format never reaches a C
# parser, and no `git` subprocess inherits the user's configuration as ambient
# authority. `default-features = false` drops `extras`, which is what keeps the
# network transports, credential helpers and `signal-hook` out of the build:
# nothing here can fetch or authenticate. Only `crates/git` depends on it.
gix = { version = "0.87.1", default-features = false, features = [
  "status",
  "revision",
  "max-performance-safe",
  "sha1",
] }
# T042 file operations: move an entry to the OS trash (Finder's Trash,
# freedesktop's, the Windows Recycle Bin). Nothing in the tree can do this, and
# hand-rolling it means `NSFileManager` through `objc2` on macOS and the
# freedesktop trash spec on Linux — far more unreviewed platform code than a
# dependency, against a workspace-wide `unsafe_code` deny. `default-features =
# false` drops `chrono`, which only dates entries for the restore listing macOS
# does not have anyway (ADR-028). Used only inside `gritty-workspace`.
trash = { version = "5.2.8", default-features = false }
# T070 watcher: cross-platform filesystem notification (FSEvents on macOS,
# inotify on Linux). Nothing in the tree observes the filesystem, and
# hand-rolling two platform backends would need far more unreviewed code than
# a dependency; it is used only inside `gritty-workspace`.
notify = "8.2.0"
# T080 search: ripgrep's own engine, in-process (ADR-022). `grep-regex` compiles
# the pattern, `grep-matcher` is the trait both sides speak (needed directly to
# locate a match inside a line), `grep-searcher` drives a `Sink` we own — which
# is what makes cancellation free and needs no adapter — and `ignore` is the
# directory walker, taken with every gitignore source turned off. No `rg`
# process is spawned, now or as a fallback. Only `crates/search` depends on
# them, and they overlap nothing already in the tree: no crate here matches
# text or walks a tree today.
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"

[workspace.lints.rust]
# Unsafe code needs a justified, reviewed `#![allow(unsafe_code)]` in the crate.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
# `panic` stays "unwind" (default) so in-process worker panics can be contained
# by the supervising core instead of aborting the whole application.
