[package]
name = "gritty-desktop"
description = "Gritty desktop shell: thin Tauri composition root over gritty-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Distinct lib name avoids bin/lib collisions (Tauri template convention).
name = "gritty_desktop_lib"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
gritty-core = { workspace = true }
gritty-terminal = { workspace = true }
gritty-persistence = { workspace = true }
open = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `test` enables the mock runtime used by tests/commands.rs to invoke commands headlessly.
tauri = { workspace = true, features = ["test"] }
gritty-terminal = { workspace = true }

[lints]
workspace = true

# T223. macOS only, and deliberately so. Nobody has run a notification on any
# other platform, so shipping the dependency everywhere would claim support
# that was never verified (rule 11) — and on Linux it drags `notify-rust`,
# `zbus` and `dbus` into every test binary, which is what made `rust-lld` die
# linking them in CI. The adapter answers "not supported" where the plugin is
# absent, which is what T223's failure table asks for.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notification = { workspace = true }
