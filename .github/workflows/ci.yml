name: CI

on:
  push:
    branches: [main]
    # Actions minutes are pooled across the whole account, not this repository,
    # and documentation carries no code: 30 of the last 40 non-merge commits on
    # main touched only docs and markdown, and each one paid for a full run.
    # `scripts/` is deliberately absent from this list — the board tooling is
    # code and stays covered.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # The only cross-platform verification in the project: there is no Linux box,
  # so nothing else compiles or runs the workspace anywhere but macOS. It stays
  # on a GitHub-hosted runner and stays cheap (1x multiplier).
  linux:
    name: Linux (check, build on main)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Runners ship rustup; this installs the exact toolchain pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 2>/dev/null || cargo --version
          rustup show

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Generated protocol types are fresh (cargo test -p gritty-core rewrites them)
        run: pnpm check:generated

      # The release build is ~30% of this job's minutes and it verifies nothing
      # `pnpm check` has not already verified — clippy and the tests compile the
      # same crates in debug. On a private repo those minutes are metered, so it
      # runs on main, on manual dispatch, or on a pull request labelled
      # `ci:build` (for a PR that touches the build itself).
      - name: Build desktop app (no bundling; packaging is Phase 7)
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:build')
        run: pnpm tauri build --no-bundle

  macos:
    name: macOS (check + app bundle)
    # The development Mac, registered as a self-hosted runner. Nothing here is
    # billed and there is no 10x multiplier, so the gate below is no longer
    # about minutes — it is about not competing for the machine someone is
    # working on. On demand only: `workflow_dispatch`, or a pull request
    # labelled `ci:macos`. Ordinary pushes to main no longer wake it, and macOS
    # is verified locally by `pnpm check` on every change anyway.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'ci:macos')
    steps:
      # `clean: false` keeps target/ and node_modules/ between runs. The default
      # (`git clean -ffdx`) deletes both, which on a persistent runner means a
      # cold Rust build every time. This is also why no cache action follows:
      # the directory that a cache would restore never goes away.
      - uses: actions/checkout@v7
        with:
          clean: false

      # CI-RUNNER-GC: `clean: false` above is why this has to exist. Refuse
      # loudly, before pnpm/cargo touch the disk, rather than let a build die
      # forty minutes in with an opaque "No space left on device". The floor
      # is dated evidence, not a guess — see the script's --floor-gb comment
      # and the task file's completion report for how it was measured.
      - name: Disk guard (refuse to start if target/ has eaten the disk)
        run: python3 scripts/runner-gc.py guard --floor-gb 25

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # This machine already carries the pinned toolchain, but the runner
      # service's PATH does not include Homebrew's rustup shims.
      - name: Put the pinned Rust toolchain on PATH
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain this job will use
        run: |
          rustup show
          cargo --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Generated protocol types are fresh (cargo test -p gritty-core rewrites them)
        run: pnpm check:generated

      - name: Build macOS app bundle
        run: pnpm tauri build --bundles app --ci

      - uses: actions/upload-artifact@v7
        with:
          name: Gritty.app-macos-arm64
          path: target/release/bundle/macos/Gritty.app
          retention-days: 7

      # CI-RUNNER-GC: strictly after the upload above, and `if: always()` so a
      # failed build (which still leaves incremental/deps/build state behind)
      # gets swept too — a failed job is exactly when nobody is watching the
      # disk. Sweeps every target/ this machine has (this checkout and every
      # `.claude/worktrees/*` lane), not just this job's own, and detects a
      # live build (a local `cargo` invocation, or another concurrent job) and
      # skips that directory rather than deleting under it — see
      # scripts/runner-gc.py and the task file's Failure behavior section.
      - name: Prune target/ and stale bundles (skips anything a live build holds)
        if: always()
        run: python3 scripts/runner-gc.py sweep --apply
