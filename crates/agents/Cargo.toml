[package]
name = "gritty-agents"
description = "Gritty agent session discovery: local coding-agent sessions read from process and transcript evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# T221: the atomic write the hook state file needs (temp -> fsync -> rename), so
# a concurrent reader never sees a partial file and neither side takes a lock.
gritty-workspace = { workspace = true }
# T221: the order-preserving JSON model the hook installer parses another tool's
# configuration into needs the `Serialize`/`Deserialize` traits themselves.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
