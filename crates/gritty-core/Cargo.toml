[package]
name = "gritty-core"
description = "Gritty application core: UI-agnostic workspace, document, operation and orchestration domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# T310-B: the Claude Code adapter the run manager drives. The dependency runs
# this way round for the same reason `gritty-agent-fake`'s does — the adapter
# cannot name an `AgentRunEvent` without a Cargo cycle — which is why the
# translation lives in `agent_run/claude_driver.rs` and not in the adapter.
gritty-agent-claude = { workspace = true }
gritty-agent-fake = { workspace = true }
gritty-agents = { workspace = true }
gritty-git = { workspace = true }
# T102-C: the write half of the git surface. A separate crate from
# `gritty-git` by ADR-029 decision 2; this module composes both, and is the
# only place that depends on the two together.
gritty-git-write = { workspace = true }
gritty-persistence = { workspace = true }
# T120-C: the settings domain this crate puts on the wire.
gritty-settings = { workspace = true }
gritty-search = { workspace = true }
gritty-terminal = { workspace = true }
gritty-workspace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Repositories built at test time (T100). The feature is off in the production
# build, where nothing runs the `git` binary (ADR-023).
gritty-git = { workspace = true, features = ["fixtures"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
